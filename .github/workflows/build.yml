name: Unpack and Build RupeeTrack APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unpack Zip and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack Any Zip Archive
        run: |
          echo "=== Scanning for zip archives ==="
          for z in $(find . -type f -iname "*.zip"); do
            echo "Unpacking: $z"
            unzip -o "$z"
          done

      - name: Fix Missing Launcher Icons
        run: |
          for manifest in $(find . -name "AndroidManifest.xml"); do
            echo "Patching manifest at: $manifest"
            sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$manifest" || true
            sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$manifest" || true
          done

      - name: Fix CsvExporter Quotes and AnalyticsScreen Fields
        run: |
          for csv_file in $(find . -name "CsvExporter.kt"); do
            echo "Patching $csv_file..."
            sed -i "s/replace(\"\"\", \"\"\"\")/replace('\"', '\'')/g" "$csv_file" || true
            sed -i "s/replace(\"\"\", \"\"\"/replace('\"', '\''/g" "$csv_file" || true
          done
          for analytics_file in $(find . -name "AnalyticsScreen.kt"); do
            echo "Patching $analytics_file..."
            sed -i 's/state\.currentMonthName/state.periodLabel/g' "$analytics_file" || true
            sed -i 's/state\.totalSpendThisMonth/state.totalSpend/g' "$analytics_file" || true
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$SETTINGS_PATH" ]; then
            BUILD_DIR=$(dirname "$SETTINGS_PATH")
            echo "Entering Gradle project directory: $BUILD_DIR"
            cd "$BUILD_DIR"
          else
            echo "Error: settings.gradle.kts not found. Listing workspace files:"
            ls -la
            exit 1
          fi
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RupeeTrack-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
