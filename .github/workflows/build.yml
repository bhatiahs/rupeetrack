name: Unpack and Build RupeeTrack APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unpack Zip and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack Any Zip Archive
        run: |
          echo "=== Scanning for zip archives ==="
          for z in $(find . -type f -iname "*.zip"); do
            echo "Unpacking: $z"
            unzip -o "$z"
          done

      - name: Fix Missing Launcher Icons
        run: |
          for manifest in $(find . -name "AndroidManifest.xml"); do
            echo "Patching manifest at: $manifest"
            sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$manifest" || true
            sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$manifest" || true
          done

      - name: Overwrite CsvExporter with Safe Quotes Filter
        run: |
          for csv_file in $(find . -name "CsvExporter.kt"); do
            echo "Writing safe CsvExporter to: $csv_file"
            cat << 'EOF' > "$csv_file"
          package com.expensetracker.upi.export

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.FileProvider
          import com.expensetracker.upi.data.TransactionEntity
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*

          object CsvExporter {

              fun generateAndShareCsv(context: Context, transactions: List<TransactionEntity>) {
                  val dateFormat = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault())
                  val timeFormat = SimpleDateFormat("HH:mm:ss", Locale.getDefault())
                  val exportDate = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())

                  val csvHeader = "ID,Date,Time,Merchant / Payee,Category,Amount (INR),Type,Payment Mode,Ref / UPI ID,Account,Source SMS\n"
                  val csvBody = StringBuilder()

                  for (tx in transactions) {
                      val date = Date(tx.timestamp)
                      val cleanMerchant = tx.merchant.filter { it != '"' }
                      val cleanSms = (tx.rawSms ?: "").filter { it != '"' }.replace('\n', ' ')

                      csvBody.append(
                          "${tx.id}," +
                          "\"${dateFormat.format(date)}\"," +
                          "\"${timeFormat.format(date)}\"," +
                          "\"$cleanMerchant\"," +
                          "\"${tx.category.displayName}\"," +
                          "${"%.2f".format(tx.amount)}," +
                          "${tx.type.name}," +
                          "${tx.paymentMode.name}," +
                          "\"${tx.vpaOrRef ?: ""}\"," +
                          "\"${tx.accountInfo ?: ""}\"," +
                          "\"$cleanSms\"\n"
                      )
                  }

                  val exportDir = File(context.cacheDir, "exports")
                  exportDir.mkdirs()
                  val file = File(exportDir, "RupeeTrack_Expenses_$exportDate.csv")
                  file.writeText(csvHeader + csvBody.toString())

                  val uri = FileProvider.getUriForFile(
                      context,
                      "${context.packageName}.fileprovider",
                      file
                  )

                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = "text/csv"
                      putExtra(Intent.EXTRA_STREAM, uri)
                      putExtra(Intent.EXTRA_SUBJECT, "RupeeTrack Expenses Export ($exportDate)")
                      putExtra(Intent.EXTRA_TEXT, "Here is my UPI and Bank expenses export from RupeeTrack in CSV format.")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }

                  val chooser = Intent.createChooser(intent, "Export / Upload to Google Drive")
                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(chooser)
              }
          }
          EOF
          done

      - name: Patch AnalyticsScreen Legacy References
        run: |
          for analytics_file in $(find . -name "AnalyticsScreen.kt"); do
            echo "Patching $analytics_file..."
            sed -i 's/state\.currentMonthName/state.periodLabel/g' "$analytics_file" || true
            sed -i 's/state\.totalSpendThisMonth/state.totalSpend/g' "$analytics_file" || true
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$SETTINGS_PATH" ]; then
            BUILD_DIR=$(dirname "$SETTINGS_PATH")
            echo "Entering Gradle project directory: $BUILD_DIR"
            cd "$BUILD_DIR"
          else
            echo "Error: settings.gradle.kts not found. Listing workspace files:"
            ls -la
            exit 1
          fi
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RupeeTrack-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
